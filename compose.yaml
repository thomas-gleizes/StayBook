networks:
  staybook-net:

volumes:
  kafka-volume:

services:
  modules_user:
    build: .docker/node
    deploy:
      replicas: 1
    volumes:
      - "./Kalat/StayBook/Modules/User:/usr/src/app"
    working_dir: "/usr/src/app"
    command: pnpm start:debug
    networks:
      staybook-net:
        aliases:
          - modules.user
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn

  system_gateway:
    build: .docker/node
    deploy:
      replicas: 1
    volumes:
      - "./Kalat/StayBook/System/Gateway:/usr/src/app"
    working_dir: "/usr/src/app"
    networks:
      staybook-net:
        aliases:
          - system.gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: warn

  system_broker:
    image: apache/kafka:4.0.0
    volumes:
      - kafka-volume:/var/lib/kafka/data
    networks:
      staybook-net:
        aliases:
          - system.broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  system_kafka_ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    networks:
      staybook-net:
        aliases:
          - system.kafka_ui
    environment:
      KAFKA_CLUSTERS_0_NAME: staybook_broker
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: system_broker:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      SERVER_SERVLET_CONTEXT_PATH: /
    depends_on:
      - system_broker
