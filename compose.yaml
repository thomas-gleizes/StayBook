networks:
  staybook-net:

volumes:
  kafka-volume:
  mongo-volume:

services:
  modules_user:
    build: .docker/node
    deploy:
      replicas: 1
    working_dir: "/usr/src/app"
    volumes:
      - "./Kalat/StayBook/Modules/UserManagement:/usr/src/app"
    command: sh -c "pnpm install && pnpm start:dev"
    networks:
      staybook-net:
        aliases:
          - modules.user
    depends_on:
      - system_broker
    environment:
      KAFKA_BROKERS: system.broker:9092
      LOG_LEVEL: debug
      NODE_ENV: development
      DATABASE_URL: "mongodb://system.mongodb:27017/users-management"

  system_gateway:
    build: .docker/node
    deploy:
      replicas: 1
    volumes:
      - "./Kalat/StayBook/System/Gateway:/usr/src/app"
    working_dir: "/usr/src/app"
    command: sh -c "pnpm install && pnpm start:dev"
    networks:
      staybook-net:
        aliases:
          - system.gateway
    depends_on:
      - system_broker
      - system_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.system_gateway.loadbalancer.server.port=3000"
      - "traefik.http.routers.system_gateway.rule=Host(`gateway.staybook.localhost`)"
      - "traefik.http.routers.system_gateway.entrypoints=web"
    environment:
      KAFKA_BROKERS: system.broker:9092
      LOG_LEVEL: debug
      NODE_ENV: development
      PORT: 3000

  system_proxy:
    image: traefik:latest
    networks:
      staybook-net:
        aliases:
          - kmotion-traefik
    ports:
      - "80:80"
    volumes:
      - ./.docker/traefik/traefik.toml:/etc/traefik/traefik.toml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.system_proxy.rule=Host(`traefik.staybook.localhost`)"
      - "traefik.http.routers.system_proxy.entrypoints=web"
      - "traefik.http.routers.system_proxy.service=api@internal"

  system_broker:
    image: apache/kafka:4.0.0
    volumes:
      - kafka-volume:/var/lib/kafka/data
    networks:
      staybook-net:
        aliases:
          - system.broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://system.broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@system.broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  system_kafka_ui:
    image: provectuslabs/kafka-ui:latest
    networks:
      staybook-net:
        aliases:
          - system.kafka_ui
    environment:
      KAFKA_CLUSTERS_0_NAME: staybook_broker
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: system_broker:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      SERVER_SERVLET_CONTEXT_PATH: /
    depends_on:
      - system_broker
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.system_kafka_ui.loadbalancer.server.port=8080"
      - "traefik.http.routers.system_kafka_ui.rule=Host(`kafka.staybook.localhost`)"
      - "traefik.http.routers.system_kafka_ui.entrypoints=web"

  system_event_store:
    build: .docker/node
    deploy:
      replicas: 1
    networks:
      staybook-net:
        aliases:
          - system.event_store
    volumes:
      - "./Kalat/StayBook/System/EventStore:/usr/src/app"
    working_dir: "/usr/src/app"
    command: sh -c "pnpm install && pnpm start:dev"
    environment:
      KAFKA_BROKERS: system.broker:9092
      LOG_LEVEL: debug
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: "mongodb://system.mongodb:27017/event_store"
    depends_on:
      - system_broker
      - system_mongodb

  system_mongodb:
    image: mongo:8.2.1-noble
    command: [ "--replSet", "rs0", "--bind_ip_all" ]
    volumes:
      - mongo-volume:/data/db
    networks:
      staybook-net:
        aliases:
          - system.mongodb

  system_init_mongo_replica:
    image: mongo:8.2.1-noble
    entrypoint: [ "mongosh", "--host", "system.mongodb", "--eval", "'rs.initiate()'" ]
    networks:
      staybook-net:
        aliases:
          - system.init.mongo.replica
    depends_on:
      - system_mongodb

  system_prisma_es:
    build: .docker/node
    command: pnpm prisma studio --hostname 0.0.0.0
    volumes:
      - "./Kalat/StayBook/System/EventStore:/usr/src/app"
    working_dir: "/usr/src/app"
    networks:
      staybook-net:
        aliases:
          - system.prisma.es
    environment:
      DATABASE_URL: "mongodb://system.mongodb:27017/event_store"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.system_prisma_es.loadbalancer.server.port=5555"
      - "traefik.http.routers.system_prisma_es.rule=Host(`event-store.prisma.localhost`)"
      - "traefik.http.routers.system_prisma_es.entrypoints=web"
