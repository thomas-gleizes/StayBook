syntax = "proto3";
package common;

message MessagePayloadEntry {
  string key = 1;
  string value = 2;
}

message MessageMetadataEntry {
  string key = 1;
  string value = 2;
}

message Message {
  string id = 1;
  string content_type = 2;
  repeated MessagePayloadEntry payload = 3;
  repeated MessageMetadataEntry metadata = 4;
  string created_by = 5;
  int64 created_at = 6;
}
