syntax = "proto3";
import "common/message.proto";
package common;

message DomainEvent {
  // Core Message
  string id = 1;
  string content_type = 2;
  repeated MessagePayloadEntry payload = 3;
  repeated MessageMetadataEntry metadata = 4;
  string created_by = 5;
  int64 created_at = 6;

  // Core Domain Event
  string state = 7;
  int32 version = 8;
  int64 occurred_at = 9;
}
