syntax = "proto3";
import "common/message.proto";
package user;

message UserCreatedPayload {
  string id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
}

message UserCreated {
  string id = 1;
  string content_type = 2;
  UserCreatedPayload MessagePayloadEntry = 3;
  string created_by = 5;
  int64 created_at = 6;

  string state = 7;
  int32 version = 8;
  int64 occurred_at = 9;
}

